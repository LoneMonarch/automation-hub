name: Build and test desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_module.py examples/workbook-checker dist/workbook-checker-1.0.0.hubmodule
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: python tools/build_app.py
      - run: python tools/smoke_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: AutomationHub-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/*.hubmodule
